appId: com.brinq.desktop
productName: Brinq
copyright: Copyright © 2026 Brinq

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - package.json

win:
  icon: assets/icon.ico
  target:
    - nsis
  artifactName: Brinq-Setup.${ext}
  # No fileAssociations on Windows: they make Brinq the machine-wide default
  # for .msg/.eml. build/installer.nsh registers an "Open with" choice instead.

nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true

mac:
  icon: assets/icon-mac.png
  target:
    - dmg
  artifactName: Brinq-${version}.${ext}
  category: public.app-category.productivity
  fileAssociations:
    - ext: eml
      name: "Email Message"
      role: Viewer
    - ext: msg
      name: "Outlook Message"
      role: Viewer

linux:
  icon: assets/icon.png
  target:
    - AppImage
  artifactName: Brinq-${version}.${ext}
  category: Office

publish:
  provider: github
  owner: edin228
  repo: brinq-desktop
