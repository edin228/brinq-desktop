name: Windows installer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: |
          npx electron-builder --win --publish never
          test -s dist/Brinq-Setup.exe
          test -s dist/Brinq-Setup.exe.blockmap
          test -s dist/latest.yml
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: brinq-desktop-windows-${{ github.sha }}
          path: |
            dist/Brinq-Setup.exe
            dist/Brinq-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      # Brinq must never own .msg/.eml or mailto:; Outlook and AMS360 rely on them.
      - name: Check installer registry behavior
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'Brinq-Setup-1.2.8.exe'
          curl.exe -fsSL -o $previous https://github.com/edin228/brinq-desktop/releases/download/v1.2.8/Brinq-Setup.exe
          ./test/windows-installer-registry.ps1 -Installer dist/Brinq-Setup.exe -PreviousInstaller $previous
