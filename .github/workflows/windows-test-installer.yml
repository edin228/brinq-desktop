name: Windows installer

on:
  push:
    branches:
      - feature/desktop-file-opening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            npx electron-builder --win --publish never -c.extraMetadata.version=1.2.6-test.1
          else
            npx electron-builder --win --publish never
          fi
          test -s dist/Brinq-Setup.exe
          test -s dist/Brinq-Setup.exe.blockmap
          test -s dist/latest.yml
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: brinq-desktop-windows-${{ github.sha }}
          path: |
            dist/Brinq-Setup.exe
            dist/Brinq-Setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
